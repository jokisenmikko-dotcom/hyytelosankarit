name: Julkaise GitHub Pagesiin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pura peli (site.tar.gz.b64)
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/site"
          base64 -d site.tar.gz.b64 > "$RUNNER_TEMP/site.tar.gz"
          sha256sum "$RUNNER_TEMP/site.tar.gz"
          tar -xzf "$RUNNER_TEMP/site.tar.gz" -C "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"
          ls -la "$RUNNER_TEMP/site" "$RUNNER_TEMP/site/icons"
          test -f "$RUNNER_TEMP/site/index.html"

      - name: Julkaise gh-pages-haaraan
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Julkaisu ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
